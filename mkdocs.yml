site_name: PyPNM-CMTS
site_description: CMTS operations toolkit documentation for PyPNM-CMTS.
site_url: https://pypnm.io
repo_url: https://github.com/PyPNMApps/PyPNM-CMTS
repo_name: PyPNMApps/PyPNM-CMTS

nav:
  - Docs hub: index.md
  - Architecture: architecture/architecture.md
  - Install: install/index.md
  - System: system/index.md
  - CLI: system/cli.md
  - Tools: tools/index.md
  - Scripts: scripts/index.md
  - Examples:
      - Overview: examples/index.md
      - CLI: examples/cli.md
  - Coordination:
      - Overview: coordination/index.md
      - Mermaid Examples: coordination/mermaid-examples.md
  - API:
      - Overview: api/index.md
      - Common: api/common/index.md
      - FastAPI: api/fast-api/index.md
      - Python: api/python/index.md
  - Tests: tests/index.md
  - Topology: topology/index.md
  - Docker: docker/index.md
  - Release: release/index.md
  - Issues: issues/index.md
  - Style guide: style-guide.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
  palette:
    - scheme: slate
      primary: blue
      accent: blue

plugins:
  - search
  - mermaid2:
      javascript: assets/vendor/mermaid/mermaid.esm.min.mjs

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
